[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "openfemlab"
version = "0.3.0"
description = "Open-source, solver-independent CAE platform for modal analysis, FE-test correlation, and sensitivity-based model updating (FEMtools-inspired)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "finite-elements",
    "modal-analysis",
    "model-updating",
    "correlation",
    "MAC",
    "structural-dynamics",
    "CAE",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
io = ["meshio>=5.3"]
io-rst = ["ansys-mapdl-reader>=0.55"]
cli = ["rich>=13.0"]
plot = ["matplotlib>=3.7"]
gui = ["pywebview>=5.0"]
accel = ["numba>=0.59"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    # Optional at runtime, required to exercise the meshio bridge tests, which
    # skip themselves when it is absent.
    "meshio>=5.3",
]
all = ["openfemlab[io,cli,plot,gui,accel]"]

[project.scripts]
openfemlab = "openfemlab.cli.main:main"

[project.urls]
Documentation = "https://github.com/openfemlab/openfemlab/blob/main/docs/ARCHITECTURE.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openfemlab = ["dashboard/static/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY"]

[tool.mypy]
python_version = "3.10"
strict = false
packages = ["openfemlab"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "acceptance: verifies a criterion of docs/ACCEPTANCE_CRITERIA.md",
    "criterion(test_id, priority): acceptance-criterion registry ID under test",
]
