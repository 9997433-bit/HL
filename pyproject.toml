[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openfemlab"
version = "0.1.0"
description = "Open-source, solver-independent structural dynamics / FE model updating toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "OpenFEMLab contributors" }]
keywords = ["fem", "modal analysis", "structural dynamics", "model updating", "cae"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "pytest>=7.0",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-cov>=4.0"]
dev = ["build>=1.0", "pytest-cov>=4.0", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/openfemlab/openfemlab"

[tool.hatch.build.targets.wheel]
packages = ["src/openfemlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
