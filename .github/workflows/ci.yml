name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest

  gates:
    name: Acceptance gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Import check
        run: python -c "import openfemlab"
      - name: Lint
        run: ruff check .
      - name: Registry consistency
        run: python -m pytest tests/acceptance/test_criteria_registry.py
      - name: Verified-criteria gate
        run: python -m pytest tests/acceptance/test_registry_ci.py
      - name: Acceptance suites
        run: python -m pytest -m acceptance
