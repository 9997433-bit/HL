name: Publish release

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: audio-studio/pyproject.toml

      - name: Install application and bundle dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "./audio-studio[installer]"

      - name: Build Linux bundle
        run: scripts/build-linux.sh --install-deps --no-smoke

      - name: Generate bundle SBOM
        run: python tools/generate_sbom.py

      - name: Prepare Linux release assets
        run: >-
          scripts/prepare-release-assets.sh
          --output-dir release-assets
          --bundle linux dist/audio-studio
          --sbom .agent_workspace/v1.1/linux-sbom.json

      - name: Upload Linux release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release-assets/
          if-no-files-found: error

  build-windows:
    name: Build Windows bundle
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: audio-studio/pyproject.toml

      - name: Install application and bundle dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "./audio-studio[installer]"

      - name: Build and verify Windows bundle
        shell: pwsh
        run: ./scripts/build-windows.ps1 -InstallDeps

      - name: Prepare Windows release asset
        shell: bash
        run: >-
          scripts/prepare-release-assets.sh
          --output-dir release-assets
          --bundle windows dist/audio-studio

      - name: Upload Windows release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release-assets/
          if-no-files-found: error

  build-macos:
    name: Build macOS bundle
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: audio-studio/pyproject.toml

      - name: Install application and bundle dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "./audio-studio[installer]"

      - name: Build macOS bundle
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --distpath dist
          --workpath build/pyinstaller
          packaging/pyinstaller.spec

      - name: Prepare macOS release asset
        run: >-
          scripts/prepare-release-assets.sh
          --output-dir release-assets
          --bundle macos dist/audio-studio

      - name: Upload macOS release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: release-assets/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - build-linux
      - build-windows
      - build-macos
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download release assets
        uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksum manifest
        run: >-
          scripts/prepare-release-assets.sh
          --output-dir release-assets
          --checksums

      - name: Verify complete release asset set
        run: |
          test -f release-assets/audio-studio-linux.zip
          test -f release-assets/audio-studio-windows.zip
          test -f release-assets/audio-studio-macos.zip
          test -f release-assets/audio-studio-sbom.json
          test -f release-assets/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/audio-studio-linux.zip
            release-assets/audio-studio-windows.zip
            release-assets/audio-studio-macos.zip
            release-assets/audio-studio-sbom.json
            release-assets/SHA256SUMS
