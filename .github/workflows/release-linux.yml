name: Linux release bundle

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux PyInstaller bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: audio-studio/pyproject.toml

      - name: Install application and bundle dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "./audio-studio[installer]"

      - name: Build Linux bundle
        run: scripts/build-linux.sh --install-deps --no-smoke

      - name: Generate software bill of materials
        shell: bash
        run: |
          if [[ -f tools/generate_sbom.py ]]; then
            python tools/generate_sbom.py
          else
            echo "::notice::tools/generate_sbom.py is not present; skipping SBOM generation"
          fi

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: audio-studio-linux-x64
          path: dist/audio-studio/
          if-no-files-found: error
