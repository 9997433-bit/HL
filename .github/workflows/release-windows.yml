name: Windows release bundle

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows PyInstaller bundle
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: audio-studio/pyproject.toml

      - name: Install application and bundle dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "./audio-studio[installer]"

      - name: Build and verify Windows bundle
        shell: pwsh
        run: ./scripts/build-windows.ps1 -InstallDeps

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: audio-studio-windows-x64
          path: dist/audio-studio/
          if-no-files-found: error
