name: Sync PR body

on:
  push:
    branches:
      - cursor/femtools-industrial-7aa3

permissions:
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update open PR for integration branch
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = fs.readFileSync('.github/pr-title.txt', 'utf8').trim();
            const body = fs.readFileSync('.github/pr-body.md', 'utf8');
            const head = `${context.repo.owner}:cursor/femtools-industrial-7aa3`;
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head,
              state: 'open',
            });
            if (prs.length === 0) {
              core.info(`No open PR found for head ${head}`);
              return;
            }
            const pr = prs[0];
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              title,
              body,
            });
            core.info(`Updated PR #${pr.number}: ${title}`);
