name: Audio CI

on:
  push:
    paths:
      - ".github/workflows/audio-tests.yml"
      - ".github/requirements.*"
      - "audio-studio/**"
      - "scripts/**"
      - "tools/**"
      - "tests/**"
      - ".agent_workspace/round1/benchmark-baseline.json"
  pull_request:
    paths:
      - ".github/workflows/audio-tests.yml"
      - ".github/requirements.*"
      - "audio-studio/**"
      - "scripts/**"
      - "tools/**"
      - "tests/**"
      - ".agent_workspace/round1/benchmark-baseline.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audio-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen
  PYTHONUTF8: "1"

jobs:
  lint-and-test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements.lock

      - name: Install locked CI dependencies
        run: |
          python -m pip install --requirement .github/requirements.lock
          python -m pip install --no-deps --editable ./audio-studio

      - name: Lint probes and support scripts
        run: ruff check tools scripts tests

      - name: Run test suites offscreen
        run: pytest -q tests audio-studio/tests

  gui-smoke:
    name: GUI smoke (null audio)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements.lock

      - name: Install locked CI dependencies
        run: |
          python -m pip install --requirement .github/requirements.lock
          python -m pip install --no-deps --editable ./audio-studio

      - name: Launch headless GUI on null device
        working-directory: audio-studio
        run: python -m audio_studio --null-audio --offscreen --exit-after 5

  performance-probes:
    name: Performance probes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Capture current benchmark
        run: >-
          python tools/benchmark_audio.py
          --output .agent_workspace/round2/benchmark-current.json

      - name: Compare with Round 1 baseline
        run: >-
          python tools/perf-regression.py
          .agent_workspace/round2/benchmark-current.json
          --output .agent_workspace/round2/performance-delta.json

      - name: Probe realtime escape-hatch thresholds
        run: >-
          python tools/monitor-realtime.py
          --mode measure
          --output .agent_workspace/round2/realtime-monitor.json

      - name: Upload performance reports
        uses: actions/upload-artifact@v4
        with:
          name: performance-probes
          path: |
            .agent_workspace/round2/benchmark-current.json
            .agent_workspace/round2/performance-delta.json
            .agent_workspace/round2/realtime-monitor.json
