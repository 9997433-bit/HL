name: Audio CI

on:
  push:
    paths:
      - ".github/workflows/audio-tests.yml"
      - ".github/requirements.*"
      - "audio-studio/**"
      - "scripts/**"
      - "tools/**"
      - "tests/**"
      - ".agent_workspace/round1/benchmark-baseline.json"
  pull_request:
    paths:
      - ".github/workflows/audio-tests.yml"
      - ".github/requirements.*"
      - "audio-studio/**"
      - "scripts/**"
      - "tools/**"
      - "tests/**"
      - ".agent_workspace/round1/benchmark-baseline.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audio-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen
  PYTHONUTF8: "1"
  PYTHONPATH: ${{ github.workspace }}

jobs:
  binding-guard:
    name: PySide6 binding guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Reject PyQt6 imports
        run: "! grep -rn PyQt6 audio-studio/"

  lint-and-test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suite: full
          - os: macos-latest
            suite: smoke
          - os: windows-latest
            suite: smoke
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Ubuntu Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libdbus-1-3 \
            libegl1 \
            libfontconfig1 \
            libgl1 \
            libglib2.0-0 \
            libxcb-cursor0 \
            libxcb-xinerama0 \
            libxi6 \
            libxkbcommon-x11-0 \
            libxrender1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements.lock

      - name: Install locked CI dependencies
        run: |
          python -m pip install --requirement .github/requirements.lock
          python -m pip install --no-deps --editable ./audio-studio

      - name: Lint probes and support scripts
        if: matrix.suite == 'full'
        run: ruff check tools scripts tests

      - name: Run full test suites offscreen
        if: matrix.suite == 'full'
        run: python -m pytest -q tests audio-studio/tests

      - name: Run cross-platform smoke suites offscreen
        if: matrix.suite == 'smoke'
        run: >-
          python -m pytest -q
          audio-studio/tests/test_types.py
          audio-studio/tests/test_loader.py
          audio-studio/tests/test_loudness.py
          tests/acceptance/test_sota_checklist.py

      - name: Generate Round 3 acceptance report
        if: matrix.suite == 'full'
        run: >-
          python tools/run_round3_acceptance.py
          --output .agent_workspace/round3/ci-acceptance-report.json

      - name: Upload Round 3 acceptance report
        if: matrix.suite == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: round3-ci-acceptance-report
          path: .agent_workspace/round3/ci-acceptance-report.json

  gui-smoke:
    name: GUI smoke (null audio)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Ubuntu Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libdbus-1-3 \
            libegl1 \
            libfontconfig1 \
            libgl1 \
            libglib2.0-0 \
            libxcb-cursor0 \
            libxcb-xinerama0 \
            libxi6 \
            libxkbcommon-x11-0 \
            libxrender1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements.lock

      - name: Install locked CI dependencies
        run: |
          python -m pip install --requirement .github/requirements.lock
          python -m pip install --no-deps --editable ./audio-studio

      - name: Launch headless GUI on null device
        working-directory: audio-studio
        run: python -m audio_studio --null-audio --offscreen --exit-after 5

  performance-probes:
    name: Performance probes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Capture current benchmark
        run: >-
          python tools/benchmark_audio.py
          --output .agent_workspace/round2/benchmark-current.json

      - name: Compare with Round 1 baseline
        run: >-
          python tools/perf-regression.py
          .agent_workspace/round2/benchmark-current.json
          --output .agent_workspace/round2/performance-delta.json

      - name: Probe realtime escape-hatch thresholds
        run: >-
          python tools/monitor-realtime.py
          --mode measure
          --output .agent_workspace/round2/realtime-monitor.json

      - name: Upload performance reports
        uses: actions/upload-artifact@v4
        with:
          name: performance-probes
          path: |
            .agent_workspace/round2/benchmark-current.json
            .agent_workspace/round2/performance-delta.json
            .agent_workspace/round2/realtime-monitor.json
