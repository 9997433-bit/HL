name: Audio probes

on:
  push:
    paths:
      - ".github/workflows/audio-tests.yml"
      - "tools/**"
      - "tests/**"
  pull_request:
    paths:
      - ".github/workflows/audio-tests.yml"
      - "tools/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install probe dependencies
        run: python -m pip install --upgrade pip pytest ruff

      - name: Lint probe code
        run: ruff check tools tests

      - name: Run boundary tests
        run: pytest -q
